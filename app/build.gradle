plugins {
    id 'com.android.application'
}

android {
    namespace 'com.sspeth.quickdraw'
    compileSdk 35
    defaultConfig {
        applicationId 'com.sspeth.quickdraw'
        minSdk 23
        targetSdk 28
        versionCode 1
        versionName '1.0.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
